<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Data Mahasiswa Modular</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="app-header">
      <h1>Aplikasi Data Mahasiswa Modular</h1>
      <p class="subtitle">Praktikum Pemrograman Visual - Modul 09</p>
    </header>

    <main class="main-content">
      <!-- Bagian Kartu Ringkasan Statistik -->
      <section class="summary-section" aria-label="Ringkasan Statistik Mahasiswa">
        <div class="summary-cards">
          <div class="summary-card">
            <span class="summary-title">Total Mahasiswa</span>
            <span class="summary-value" id="totalMahasiswa">0</span>
          </div>
          <div class="summary-card summary-lulus">
            <span class="summary-title">Lulus</span>
            <span class="summary-value" id="totalLulus">0</span>
          </div>
          <div class="summary-card summary-belum-lulus">
            <span class="summary-title">Belum Lulus</span>
            <span class="summary-value" id="totalBelumLulus">0</span>
          </div>
        </div>
      </section>

      <!-- Bagian Form Input / Edit Mahasiswa -->
      <section class="card form-section" aria-labelledby="form-heading">
        <h2 id="form-heading">Tambah Data Mahasiswa</h2>
        
        <form id="formMahasiswa" novalidate>
          <div class="form-group">
            <label for="nama">Nama Mahasiswa</label>
            <input 
              type="text" 
              id="nama" 
              name="nama" 
              placeholder="Contoh: Budi Santoso" 
              autocomplete="off"
            >
          </div>

          <div class="form-group">
            <label for="nim">Nomor Induk Mahasiswa (NIM)</label>
            <input 
              type="text" 
              id="nim" 
              name="nim" 
              placeholder="Contoh: 202401001" 
              autocomplete="off"
            >
          </div>

          <div class="form-group">
            <label for="nilai">Nilai</label>
            <input 
              type="number" 
              id="nilai" 
              name="nilai" 
              min="0" 
              max="100" 
              placeholder="0 - 100"
            >
          </div>

          <div class="form-actions">
            <button type="submit" id="btnSubmit" class="btn btn-primary">Tambah Mahasiswa</button>
            <button type="button" id="btnBatal" class="btn btn-secondary" style="display: none;">Batal</button>
          </div>
        </form>

        <!-- Area Pesan Feedback / Status -->
        <p id="pesan" role="status" aria-live="polite"></p>
      </section>

      <!-- Bagian Tabel Daftar Mahasiswa & Pencarian -->
      <section class="card table-section" aria-labelledby="table-heading">
        <div class="table-header-wrap">
          <h2 id="table-heading">Daftar Mahasiswa</h2>
          
          <!-- Fitur Pencarian Nama / NIM -->
          <div class="search-box">
            <label for="cari" class="sr-only">Cari Mahasiswa</label>
            <input 
              type="search" 
              id="cari" 
              name="cari" 
              placeholder="🔍 Cari nama atau NIM..." 
              autocomplete="off"
            >
          </div>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nama</th>
                <th>NIM</th>
                <th>Nilai</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="daftarMahasiswa">
              <!-- Baris mahasiswa akan diisi oleh ui.js -->
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
